[project]
name = "smote-test-bench"
version = "0.1.0"
description = "Research benchmark for SMOTE-family oversampling methods."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "clearml>=2.0.0,<3",
  "numpy>=1.21.0,<3",
  "pandas>=1.3.0,<3",
  "scikit-learn>=1.0.0,<2",
  "smote-variants>=0.7.3,<0.8",
  "scipy>=1.7.0,<2",
  "matplotlib>=3.4.0,<4",
  "pyyaml>=5.4.0,<7",
  "pydantic>=2.6.0,<3",
  "seaborn>=0.13.2,<1",
  "plotly>=6.3.1,<7",
  "catboost>=1.0.0,<2",
  "pyclustering>=0.10.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
